[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
authors = ["World Contributors"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/worldcoin/ownership-gateway"
repository = "https://github.com/worldcoin/ownership-gateway"

[workspace.dependencies]
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
url = "2"
tokio = { version = "1.48", features = ["macros", "rt"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"

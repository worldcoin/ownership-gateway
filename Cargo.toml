[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
authors = ["World Contributors"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/worldcoin/ownership-gateway"
repository = "https://github.com/worldcoin/ownership-gateway"

[workspace.dependencies]
async-trait = "0.1"
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-kms = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
clap = { version = "4", features = ["derive", "env"] }
eddsa-babyjubjub = { package = "taceo-eddsa-babyjubjub", version = "0.6" }
eyre = "0.6"
metrics = "0.24"
metrics-exporter-statsd = "0.9"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
rayon = "1"
redis = { version = "1.8.1", default-features = false, features = ["connection-manager", "tokio-comp", "tokio-rustls-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
telemetry-batteries = "0.4.1"
testcontainers = "0.25"
testcontainers-modules = "0.13"
thiserror = "2"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
url = { version = "2", features = ["serde"] }
wiremock = "0.6"
world-id-primitives = "=0.20.0"
world-id-proof = { version = "=0.20.0", features = ["embed-ownership-verifier"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# ProveKit's debug-only transcript pattern is omitted from serialized proofs.
# These crates must share release-mode transcript behavior to verify wire proofs.
[profile.dev.package.provekit-common]
debug-assertions = false
[profile.dev.package.provekit-whir]
debug-assertions = false
[profile.dev.package.provekit-prover]
debug-assertions = false
[profile.dev.package.provekit-verifier]
debug-assertions = false

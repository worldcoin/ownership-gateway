name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # world-id-proof compiles its bundled ownership circuit with exactly this nargo version. Keep
  # both in step with nix/nargo.nix (its x86_64-linux hash is the same digest in SRI form).
  NARGO_VERSION: 1.0.0-beta.26
  NARGO_SHA256: 64048040befd55a987158b11137d8f38f9688f696db4d84910dd1bcf0442fb80

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install nargo
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nargo.tgz "https://github.com/noir-lang/noir/releases/download/v${NARGO_VERSION}/nargo-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NARGO_SHA256}  /tmp/nargo.tgz" | sha256sum --check
          mkdir -p "$HOME/.nargo/bin"
          tar -xzf /tmp/nargo.tgz -C "$HOME/.nargo/bin"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- --deny warnings

  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install nargo
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nargo.tgz "https://github.com/noir-lang/noir/releases/download/v${NARGO_VERSION}/nargo-x86_64-unknown-linux-gnu.tar.gz"
          echo "${NARGO_SHA256}  /tmp/nargo.tgz" | sha256sum --check
          mkdir -p "$HOME/.nargo/bin"
          tar -xzf /tmp/nargo.tgz -C "$HOME/.nargo/bin"
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      # Integration tests start Redis through testcontainers on the runner's Docker daemon.
      - run: cargo test --locked --workspace --all-features

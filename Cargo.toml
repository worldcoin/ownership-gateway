[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98.1"
version = "0.1.0"
authors = ["World Contributors"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/worldcoin/ownership-gateway"
repository = "https://github.com/worldcoin/ownership-gateway"

[workspace.dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
metrics = "0.24"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand = "0.8"
redis = { version = "1.8.1", default-features = false, features = ["connection-manager", "tokio-comp", "tokio-rustls-comp"] }
rustls = { version = "0.23", features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
testcontainers = "0.25"
testcontainers-modules = "0.13"
thiserror = "2"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
url = "2"
world-id-primitives = "=0.20.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
module_name_repetitions = "allow"

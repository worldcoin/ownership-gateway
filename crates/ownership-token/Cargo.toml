[package]
name = "ownership-token"
description = "Claims and verification for World ID ownership tokens issued by ownership-gateway."
edition.workspace = true
rust-version.workspace = true
version.workspace = true
authors.workspace = true
readme.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
test-util = []
remote-jwks = ["dep:reqwest", "dep:tokio", "dep:tracing", "dep:getrandom"]
tower = ["dep:axum", "dep:tower"]

[dependencies]
base64.workspace = true
p256.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
reqwest = { workspace = true, optional = true }
tokio = { version = "1.48", features = ["rt", "sync", "time"], optional = true }
tracing = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
tower = { workspace = true, optional = true }

[dev-dependencies]
ownership-token = { path = ".", features = ["test-util"] }
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
reqwest.workspace = true
axum.workspace = true
tower.workspace = true

[lints]
workspace = true
